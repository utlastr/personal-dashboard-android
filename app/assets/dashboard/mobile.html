<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Personal Dashboard</title><link rel="stylesheet" href="mobile.css"><script src="mobile.js" defer></script></head>
<body>
<header><img src="logo.png" alt="" width="26" height="26"><strong>Personal Dashboard</strong><button id="refresh" class="icon-button" aria-label="Refresh" title="Refresh">↻</button><button id="connection" class="icon-button" aria-label="Device and connection" title="Device and connection">⋮</button></header>
<main>
<nav class="tabs" role="tablist" aria-label="Reporting period"><button id="day" role="tab" aria-selected="true" class="active">Day</button><button id="week" role="tab" aria-selected="false">Week</button></nav>
<div class="date-picker"><button id="previous" class="icon-button" aria-label="Previous period" title="Previous period">‹</button><label><span class="sr-only">Choose date</span><input id="date" type="date" required></label><button id="next" class="icon-button" aria-label="Next period" title="Next period">›</button></div>
<section class="usage-panel">
<div class="device-line"><h1>This device</h1><span id="role-badge">Personal phone</span></div>
<div class="metrics"><span id="total-label">Screen time today</span><strong id="total-time">0 min</strong><span id="range-label"></span></div>
<div class="section-head"><h2 id="distribution-title">Hourly distribution</h2></div>
<div id="summary-chart" class="chart"></div>
<p id="screen-time-total" class="chart-selection" hidden></p>
<p id="summary-selection" class="chart-selection" role="status"></p>
</section>
<div id="permission" hidden><p>Usage access is off.</p><button id="grant">Open usage access settings</button></div>
<div id="limit-notice" hidden><p id="limit-notice-text"></p><button id="limit-grant">Open accessibility settings</button></div>
<div id="message" role="status" hidden></div>
<section class="usage-panel app-panel"><div class="section-head"><h2>App usage</h2></div><div id="apps" class="rows"></div></section>
<footer><span id="sync-state"></span><span id="collect-state"></span></footer>
</main>
<dialog id="app-detail" aria-labelledby="detail-title">
<div class="dialog-head"><h2 id="detail-title"></h2><button id="close-detail" class="icon-button" aria-label="Close details" title="Close details">×</button></div>
<p id="detail-range"></p><strong id="detail-total" class="detail-total"></strong>
<div class="detail-controls"><select id="detail-group" aria-label="Group by"><option value="hours">By hour</option><option value="days">By day</option></select><select id="detail-metric" aria-label="Metric"><option value="duration">Screen time</option><option value="frequency">Times opened</option></select></div>
<div id="detail-chart" class="chart"></div><p id="detail-selection" class="chart-selection" role="status"></p>
</dialog>
<dialog id="device-dialog" aria-labelledby="device-title">
<div class="dialog-head"><h2 id="device-title">Device and connection</h2><button id="close-device" class="icon-button" aria-label="Close" title="Close">×</button></div>
<h2>App limits</h2>
<label class="limit-switch"><input id="limits-enabled" type="checkbox" checked>Enable daily app limits</label>
<p>Bilibili 22:00–23:00<br>Douyin 16:30–18:00</p>
<p id="limit-status" role="status"></p>
<p id="limit-error" role="status" hidden></p>
<div class="update-actions"><button id="limit-access">Open accessibility settings</button><button id="limit-alarm" hidden>Allow exact alarms</button></div>
<form id="config"><label for="name">Device name</label><input id="name" required maxlength="80">
<label for="role">Device role</label><select id="role"><option value="personal">Personal phone</option><option value="work">Work phone</option></select>
<label for="server">Desktop server address</label><input id="server" type="url" placeholder="http://192.168.1.244:5668" autocomplete="off">
<label for="token">Pairing code</label><input id="token" type="password" autocomplete="off"><button type="submit" class="primary">Save and sync</button><p id="save-status" role="status"></p></form>
<hr><p id="version"></p><p id="update-status" role="status"></p><div class="update-actions"><button id="check-update">Check for updates</button><button id="install" hidden>Install update</button><button id="export">Export usage</button></div><p><a href="/OPEN_SOURCE.html">Open-source licenses</a></p>
</dialog>
</body></html>
